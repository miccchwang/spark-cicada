# slots/slot.gross_profit.yaml —— 毛利额数据槽
#
# ★ 2026-10-07 修正说明：原 algorithms/gmp.yaml 把毛利额的来源写成 `slot.gp`，
#   但 `gp` 是**算法**（algo.gp = rev - cogs）——算法与数据槽是两个正交概念，
#   算法不得作为数据槽被依赖（G4「算法/数据槽分离」）。且公式 `gp / rev` 的分子
#   是**金额（THB）**，必须来自一个金额槽。故显式声明本槽。
#
# 口径：毛利额 = 收入 − 成本额，明细口径与 algo.gp 一致（unit: THB）。
id: slot.gross_profit
name: 毛利额
source_kind: derived
source_ref: pnl_sku_month         # 取自预计算桶的 gp 物化列（docs/03 §3.2）
key_strategy: store_sku
coverage_gate: 0.80               # 与成本同门槛：成本不可用则毛利不可用
freshness: 1d
permission: L3
status: AVAILABLE
notes: |
  毛利额（THB）。用于 algo.gmp 的分子（毛利率 = 毛利额 / 收入）。
  收入为 0 时 gmp 返回 null（绝不返回 0，以免被误读为「零毛利」）。
