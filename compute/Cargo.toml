[package]
name = "spark-compute"
version = "0.1.0"
edition = "2021"
description = "spark-cicada 计算内核（M-ALGO / M-PRECOMP / M-RULE）—— 只计算，不碰 HTTP 编排"

[lib]
name = "spark_compute"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "spark-compute"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
