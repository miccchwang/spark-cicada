name: ci

# 验收闸门（docs/05）在 CI 上强制执行。
#
# ★ 设计要点：**真库闸门不允许 skip**。
#   本地没有 docker/psql 时，internal/store 的 6 条集成测试会 skip；
#   如果 CI 也 skip，那 M1 数据面就从未被真正验证过 —— 闸门形同虚设。
#   因此 CI 起一个真 Postgres service，并设 SPARK_REQUIRE_DB=1：
#   未设 DSN 时测试**直接失败**，而不是静默跳过。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  # ───────────────────────── Go：构建 + 全部闸门 + 真库集成 ─────────────────────────
  go:
    name: Go 闸门（含真 Postgres）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_ci_only
          POSTGRES_DB: spark_cicada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spark -d spark_cicada"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 仅 CI 用的临时口令；不是任何真实环境的口令（G11：不入库、不入镜像）。
      # ★ 两个名字都设：运行期组件（sparkd/spark-migrate）读 SPARK_DB_DSN，
      #   真库集成测试读 SPARK_TEST_DB_DSN。曾因只设后者而让迁移步骤
      #   「未配置连接信息」秒退、其后所有真库闸门全部 skip。
      SPARK_DB_DSN: postgres://spark:spark_ci_only@localhost:5432/spark_cicada?sslmode=disable
      SPARK_TEST_DB_DSN: postgres://spark:spark_ci_only@localhost:5432/spark_cicada?sslmode=disable
      SPARK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 构建
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # 连接串自检：在跑迁移之前先证明「配置确实被解析出来了」。
      # 若这一步失败，报错会直指配置名，而不是让迁移以一句模糊的
      # 「无法连接数据库」失败、再让人以为是 SQL 写错。
      - name: ★ 连接串解析自检（DSN 必须非空）
        working-directory: backend
        run: |
          go test ./internal/db/ -run TestDSNFromEnv -count=1 -v

      # 迁移必须先把库建起来 —— 真库测试依赖 schema。
      - name: 应用迁移（真库，幂等）
        working-directory: backend
        run: go run ./cmd/spark-migrate -dir ../sql/migrations -up

      - name: 迁移可重复执行（幂等性）
        working-directory: backend
        run: go run ./cmd/spark-migrate -dir ../sql/migrations -up

      - name: 迁移状态
        working-directory: backend
        run: go run ./cmd/spark-migrate -dir ../sql/migrations -status

      - name: 全部 Go 测试
        working-directory: backend
        run: go test ./... -count=1

      - name: SQL 静态闸门
        working-directory: backend
        run: go test ./internal/gate/ -run 'TestSQL' -count=1 -v

      # ★ G2/G3/G4/G5 数据槽注册表 + 接线闸门。
      #   读**真** slots/*.yaml 与 algorithms/*.yaml，过**真** gate 判定函数
      #   （CheckAlgorithmNoDataSource / CheckSlotsRegistered / DecideCoverage /
      #    CheckDefaultCollapsed / CheckNoZeroImputation），并用静态扫描钉住
      #   「这些判定函数必须有非测试调用点」。
      #   在此之前它们全仓**没有任何生产调用点** ⇒ 四条闸门恒真、YAML 从没被扫过。
      #   已实测抓到真缺陷：algo.gmp 把算法 algo.gp 当数据槽 slot.gp 依赖（分类错误）。
      #
      #   ★ 同一步覆盖「槽的采集时效闭环」（2026-10-07 第二轮，第十三个变种）：
      #     slots/*.yaml 的 freshness 此前**被读、被写进 DB、然后没有任何判定消费它** ——
      #     `freshness: 7d` 与 `freshness: 想写什么写什么` 行为完全等价，
      #     于是一份覆盖率 100% 但停在三个月前的快照会被照常采用（报表给出旧数字）。
      #     现由 gate.CheckFreshnessDeclared（声明层，自由文本即加载失败）
      #     + slot.CheckFreshness / Cases / Judge（判活：过期 ⇒ DEGRADED ⇒ 算法 skip）关把，
      #     无读数按过期处理（fail-closed）。见 freshness_test.go。
      - name: ★ 数据槽注册表闸门（G2/G3/G4/G5 真读 YAML + 接线 + freshness 时效）
        working-directory: backend
        run: go test ./internal/slot/ -count=1 -v

      # ★ 桶注册表闸门（G4 引用完整性的**反向**：桶 → 算法）
      #   buckets/*.yaml 的 produced_by 在此之前**全仓没有任何代码读过** ——
      #   pnl_month.yaml 可以列出 algo.rev / algo.net_rev / algo.platform_fee 等
      #   在 algorithms/ 下**并不存在**的算法而不报错。后果不是「少一条断言」，
      #   而是 G6 的 AffectedBuckets（算法升级后要重算哪些桶）**静默漏算**。
      #   bucket_test.go 从 LoadBucketRegistry 入口进、以加载成功/失败出，
      #   并用静态扫描钉住 gate.CheckBucketProducersRegistered 有非测试调用点。
      #   已实测抓到真缺陷：pnl_month 的 produced_by 含 4 个幽灵算法。
      - name: ★ 桶注册表闸门（G4 反向引用完整性：桶→算法）
        working-directory: backend
        run: go test ./internal/slot/ -count=1 -run "Bucket" -v

      # ★ 公式值绑定闸门（G4 引用完整性的**第四侧**：公式自由变量 → 槽/上游算法）
      #   G4 前三侧只查「名字**是否存在**」（槽已注册 / 算法已注册 / 规则已注册），
      #   而算法真正的执行载荷 —— `formula` —— 的**自由变量从没被任何断言看过**。
      #   槽 slot.revenue 绑出的变量名是 revenue，公式却写 rev ⇒ 内核
      #   spark-compute 对查不到的变量返回 Scalar::Missing（**不报错**），
      #   配合 missing_policy: skip 该列在**每条数据**上被静默跳过（全空、零报错）。
      #   本闸门上线首日即抓到 3 个真实缺陷（algo.gp / algo.gmp / algo.net_contrib）。
      #   同一步还钉住「PENDING 算法不得入桶」与「运行时与静态闸门共用同一条
      #   BareName 约定」（防「静态全绿、运行时全空」的最坏组合）。
      - name: ★ 公式值绑定闸门（G4 第四侧：公式变量绑定 + PENDING 不入桶 + 接线）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ ./internal/precomp/ -count=1 -run "Formula|BareName|Pending|Binding|Wiring" -v

      # ★ 规则集注册表闸门（G4 引用完整性的**第三侧**：规则 → 槽/桶）
      #   rules/*.yaml 是 docs/01 §0.3 明写的「费率/口径唯一事实源」，但在此之前
      #   **全仓没有任何代码读过它**（grep "rules/" 唯一命中是 README 的一句话）。
      #   后果不是「少一条断言」，而是 G6 的规则漂移检测**没有输入来源** ——
      #   规则升版本后没有任何桶会被标记 stale，报表口径慢慢失真而无人知。
      #   rule_test.go 从 LoadRuleRegistry 入口进、以加载成功/失败出，
      #   并覆盖「桶 → 规则」（rule_versions）这一方向 + 迁移种子版本一致性
      #   （不需要数据库就能拦 —— 已实测抓到 0004 种子版本 2 vs 事实源 6 的真缺陷）。
      - name: ★ 规则集注册表闸门（G4 第三侧：规则→槽/桶 + 桶→规则 + 种子版本）
        working-directory: backend
        run: go test ./internal/rule/ -count=1 -v

      # ★ 桶刷新节律闸门（G4 第五侧：refresh 声明 + 到期判定）
      #   Bucket.Refresh 的全链路（YAML → 结构体 → registry_bucket.refresh 列）
      #   此前**唯一的校验是「非空字符串」** ⇒ monthly_incremental 与乱写完全等价，
      #   且没有任何到期判定 ⇒ 桶可能无限期陈旧而无人知（静默的旧表）。
      #   现：声明必须是已知节律（自由文本即加载失败）；Bucket.IsDue 真正做到期判定
      #   （从未刷新 / 未知节律一律 fail-closed 判到期，manual/event 不参与）。
      #   与槽的 freshness 互补：一个管「上游数据新不新」，一个管「桶该不该重算」。
      - name: ★ 桶刷新节律闸门（G4 第五侧：refresh 声明 + 到期判定 + 接线）
        working-directory: backend
        run: go test ./internal/slot/ ./internal/gate/ -count=1 -run "Refresh" -v

      # ★ 槽数据来源闸门（G4 引用完整性的**第六侧**：槽来源可解析 + 算法写入桶已注册）
      #   槽的 source_kind / source_ref 全链路（YAML → Slot → registry_slot 列）被读、被存，
      #   但在此之前**唯一的校验是 SourceKind == ""** ⇒ source_ref: x / todo /
      #   source_kind: 想写什么写什么 一律照过（声明等于装饰）；算法的 writes_bucket
      #   更是从未被校验。★ 闸门首日抓到真缺陷：slot.gross_profit 的 source_ref
      #   pnl_sku_month 与 algorithms/{cogs,gmp,gp} 的 writes_bucket 指向**并不存在的桶**
      #   （唯一桶是 pnl_month）⇒ 写入的桶漂移、currentAlgoVersions 静默取空，
      #   G6 漂移检测对该桶**永远沉默**。
      #   现：kind 必须已知（与 0005 迁移 CHECK 同源）、外部来源必带非占位符 ref、
      #   derived 的 ref 必须真解析（fact 表全称/简名或已物化桶），否则 fail-closed。
      #   派生解析依赖桶 ⇒ 在桶装载后经 slot.ValidateWithBuckets **重校验**
      #   （sparkd loadSpecs 调用，收口加载顺序静默窗口）。
      - name: ★ 槽来源闸门（G4 第六侧：来源可解析 + 算法写入桶已注册 + 接线）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ -count=1 -run "SlotSource|AlgoWritesBucket" -v

      # ★ 槽匹配键策略闸门（G4 引用完整性的**第七侧**：key_strategy 可解析 + 键口径一致）
      #   承袭本仓「字段被读进来、写进 DB，却没有任何判定消费」这个病的**第十五个变种**：
      #   槽的 key_strategy 全链路（YAML → Slot → registry_slot.key_strategy 列）被读被存，
      #   但在此之前**没有任何第四类用法**（比较/判定/阈值）⇒ 16 个槽全声明了它，
      #   而 `store_sku` 与 `随便写` 在行为上完全等价。
      #   后果不是「少一条断言」，而是**跨源对齐口径失去判据**：key_strategy 决定
      #   多条来源按什么键合并成一行；写错它，桶照样算出来，但合并后的每一行都可能
      #   张冠李戴（A 店的成本配到 B 店的收入上），且全程零报错。
      #   现：策略必须已知（唯一权威表 gate.keyStrategies）、分隔符归一但**不做语义猜测**、
      #   并与来源种类相称；另单列**跨槽一致性**判定 —— 共用同一来源的槽若按不同键对齐
      #   是「逐条合法、合起来是错的」，单元断言看不见（fail-closed）。
      - name: ★ 槽匹配键策略闸门（G4 第七侧：key_strategy 可解析 + 共用来源键口径一致）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ -count=1 -run "KeyStrategy" -v

      # ★ 密级闸门（G4 引用完整性的**第八侧**：permission 可解析 + 与 DB CHECK 词表同源）
      #   承袭本仓「字段被读进来、写进 DB，却没有任何判定消费」这个病的**第十六个变种**：
      #   槽与算法的 permission 全链路（YAML → 结构体 → registry_*.permission 列）被读被存，
      #   但 Go 侧唯一的校验是 `s.Permission == ""` ⇒ 16 个槽 + 4 个算法全声明了它，
      #   而 `L4` 与 `想写什么写什么` 在 Go 侧行为完全等价（DB 的 CHECK 只是入库兜底）。
      #   后果是**越权**：成本/利润类槽（L3/L4）一旦被写成 L1，就会与产品 ID 同权限暴露。
      #   现：档位必须已知（唯一权威表 gate.permissionLevels）、与 0002 的 CHECK 词表**同源**
      #   （在加载期就把 DB 那份读出来逐个比对，防两处各写一份词表迟早漂移）。
      #   ★ 本侧**刻意不做**「算法密级 ≤ 原料槽密级」的单调性断言 —— 已实测证伪：
      #   algo.cogs(L4) ← slot.qty(L2) × slot.cost_unit(L4) 在业务上正当（销量属内部、
      #   成本属核心），强行断言单调只能靠「抬高 slot.qty 到 L4」（过度限权）或
      #   「压低 algo.cogs 到 L2」（把核心成本降级 = 真正的安全回归）来满足，二者都是伪造。
      - name: ★ 密级闸门（G4 第八侧：permission 可解析 + 与 DB 词表同源）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ -count=1 -run "Permission" -v

      # ★ 计量单位闸门（G4 第九侧：unit 可解析 + 与种子/公式形态相称 + 下游携带）。
      #   此前 `unit` 是**被读进来、写进 DB（registry_algorithm.unit）、但没有任何判定消费**
      #   的一个字段：全仓 `grep "\.Unit"` 的非测试命中只有 admin_handlers.go / plane.go /
      #   store/admin.go 三处，**全是序列化与建表**；`precomp.AlgoDef.Unit` 更是结构性死字段
      #   （BuildRow 从不读它）⇒ `unit: THB` 与 `unit: 想写什么写什么` 在加载期完全等价。
      #   后果是**量纲静默失真**：algo.gmp 是比率（0.42）却可被写成 THB ⇒ 页面出现
      #   `0.42 THB` 这种静默错误口径；跨算法聚合（哪些列可相加）也以 unit 为唯一判据。
      #   现：单位必须可解析（唯一权威表 gate.algoUnits）、**与公式形态相称**
      #   （比率公式不得声明为金额）、与 0002/0004 **同源**（加载期静态比对，不连库）；
      #   并由 precomp 把单位**随单元格产出**（CellResult.Unit / RowResult.Units），
      #   让它第一次成为可被下游消费的结构化输出。
      #   ★ 闸门首日抓出真缺陷：0004 种子写 CNY / ratio，而 algorithms/*.yaml 写 THB / percent
      #   —— 两侧各写一份词表，谁也没错、就是不一致；已统一为 THB / %。
      #   ★ 本侧**刻意不做**「公式量纲推断」（THB 是业务约定，不是表达式能推出来的）；
      #   与公式的相称判定也只做**单向、很窄**的可疑提示（参第八侧教训：闸门本身也可能是错的）。
      - name: ★ 单位闸门（G4 第九侧：unit 可解析 + 与种子同源 + 与公式相称 + 下游携带）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ ./internal/precomp/ -count=1 -run "Unit|TestBuildRow" -v

      # ★ 算法版本闸门（G4 第十侧：version 可解析 + 登记不得倒退 + 与种子同源）。
      #   此前 `version` 看似「处处都在用」（registry_algorithm.version 列 / VersionDrift /
      #   AlgoVersions / AffectedBuckets），但把它的**值**当被校验对象看，全链路只有
      #   解析 / 赋值 / **逐层搬运**三类用法，**没有第四类**（比较 / 判定 / 阈值）：
      #     * 全仓非测试代码里没有一处把 Algorithm.Version 与算法身份比较；
      #     * admin.Plane.ValidateAlgorithm（唯一登记入口）对它**零校验**；
      #     * RegisterAlgorithm 只在 Version<=0 时静默改成 1（**缺省填充，不是校验**）；
      #     * 0002 把 version 建成 integer NOT NULL 且**无 CHECK**。
      #   ⇒ `version: 想写什么写什么` 在加载期与入库期行为完全等价（第十八个变种）。
      #   后果是**版本漂移检测静默失真**（G6 全部结论都建在它上面）：版本号是「改了公式
      #   要重算哪些桶」的**唯一判据**，改公式忘了 +1 ⇒ AffectedBuckets 返回空 ⇒ 改了公式
      #   却不重算、报表长期显示错误口径；版本还能**倒退**让已重算的桶被判「版本超前」。
      #   现：版本必须为正整数（v3 / 3.1 / latest / +3 即加载失败）、登记时不得倒退
      #   （next<prev ⇒ 拒绝；prev==0 首次登记放行）、与 0004 种子**加载期静态同源比对**。
      #   ★ 本侧**刻意不做**「YAML vs 0004 种子的身份对平」—— 实测两侧已真实分叉
      #   （algo.cogs 3/2、algo.gmp 3/1、algo.net_contrib 2/1、algo.gp 3/3），但静态无法
      #   判定哪侧是真相（种子被 ON CONFLICT DO UPDATE 覆盖，谁先谁后取决于部署顺序）；
      #   如实记录并交用户拍板（docs/06 F15），不靠改数据迁就未经验证的规则。
      - name: ★ 版本闸门（G4 第十侧：version 可解析 + 登记不得倒退 + 与种子同源）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ ./internal/admin/ -count=1 -run "Version|G4Wiring" -v

      # ★ 桶索引闸门（G4 第十一侧：indexes 可解析 + 与迁移 DDL 双向同源）。
      #   此前 `buckets/*.yaml` 的 `indexes` 是**被读被存但无判定消费**的字段：
      #   全仓 `grep "\.Indexes"` 命中 **0**（连序列化都没有，`gate.BucketDoc`
      #   里根本没有这个字段），而真正建索引的是迁移 0003 里**手写**的
      #   CREATE INDEX —— 两侧互不校验。⇒ 删掉一条索引（该过滤维度退化成
      #   全表扫描、只在慢查询里才看得见）不会有任何东西变红（第十九个变种）。
      #   现：声明必须可解析（列名须匹配 `[a-z_][a-z0-9_]*`、同一条索引不得重复列、
      #   同一桶不得重复声明同一条索引）；并与迁移里手写的 CREATE INDEX
      #   **双向逐条对平**（读真迁移文件；被注释掉的索引不算数、
      #   表达式索引与部分索引整条跳过、列序敏感）。
      #   本步同时钉住接线：`gate.CheckBucketIndexesDeclared` 必须在
      #   `slot/bucket.go` 的 validate 里有**真实生产调用点**（G4Wiring）。
      - name: ★ 桶索引闸门（G4 第十一侧：indexes 可解析 + 与迁移 DDL 双向同源）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ -count=1 -run "Indexes|BucketTableName|G4Wiring" -v

      # ★ 桶粒度闸门（G4 第十二侧：grain 可解析 + 与物理唯一键同源）。
      #   此前 `buckets/*.yaml` 的 `grain` 是桶的**定义性属性**（一行 = 一个 grain
      #   组合），但唯一的校验是 `len(b.Grain) == 0` —— 列名是否合法不查、与物理表
      #   的**唯一键**更是完全没有关联。而真正保证「一行一个 grain」的是迁移里的
      #   唯一键（0003 的 UNIQUE 约束 / 0011 的租户唯一索引）。两侧互不校验 ⇒
      #   改 YAML 的 grain（例如加一列 spu）而不动迁移，声明与物理去重键**静默
      #   分叉**：同一 grain 组合被拆成多行 / 互相覆盖，全程零报错（第二十个变种）。
      #   现：grain 必须可解析（列名须匹配 `[a-z_][a-z0-9_]*`、不得重复列）；
      #   并与迁移里手写的唯一键**对平**（剥离 tenant_id 前缀后**集合**相等；
      #   集合而非序列 —— 唯一键是集合语义，与第十一侧的索引列序敏感刻意相反）。
      #   本步同时钉住接线：`gate.CheckBucketGrainDeclared` 必须在
      #   `slot/bucket.go` 的 validate 里有**真实生产调用点**（G4Wiring）。
      - name: ★ 桶粒度闸门（G4 第十二侧：grain 可解析 + 与物理唯一键同源）
        working-directory: backend
        run: go test ./internal/gate/ ./internal/slot/ -count=1 -run "Grain|G4Wiring" -v

      - name: 控制面闸门
        working-directory: backend
        run: go test ./internal/admin/ -count=1 -v

      - name: ★ 真库集成闸门（必须真跑，不得 skip）
        working-directory: backend
        run: go test ./internal/store/ -run Integration -count=1 -v

      # ★ M-COLLECT 临时仓库真库闸门。
      #   与上一步同理：无 DSN 时直接失败，绝不静默跳过。
      #   这一层专门测「编码 / NULL 语义 / 类型严格性」这类**只有真库才暴露**的约束
      #   （已实测抓到 NUL 字节与 nil 切片两个生产级缺陷，纯单测全绿）。
      - name: ★ M-COLLECT 临时仓库真库闸门（必须真跑，不得 skip）
        working-directory: backend
        run: go test ./internal/collectstore/ -run Integration -count=1 -v

  # ───────────────────────── Rust：计算内核 ─────────────────────────
  rust:
    name: Rust 计算内核
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compute
      - name: cargo test
        working-directory: compute
        run: cargo test --locked
      - name: 内核自检
        working-directory: compute
        run: cargo run --quiet --locked -- --selftest

  # ───────────────────────── 前端：分层闸门 ─────────────────────────
  web:
    name: 前端闸门（三段解耦）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: 分层闸门（G1-a/b/c/d + G3）
        working-directory: web
        run: node scripts/layering-gate.mjs

      - name: 类型检查
        working-directory: web
        run: npx tsc --noEmit

      - name: 测试（G2/G3 + 契约镜像 + fail-closed）
        working-directory: web
        run: node --test test/*.test.mjs

      - name: 构建
        working-directory: web
        run: node scripts/build.mjs

      # G11b：前端产物不得含 secret 形态
      - name: 产物密钥扫描
        working-directory: web
        run: |
          if grep -rEn '(client_secret|api_key|access_token|BEGIN [A-Z ]*PRIVATE KEY|user:pass@)' dist/; then
            echo "::error::前端产物中发现疑似密钥（G11b）"
            exit 1
          fi
          echo "产物密钥扫描通过"

  # ───────────────────────── G8 性能闸门（真实测量 + 判定）─────────────────────────
  #
  # ★ 本作业的存在本身就是一条闸门（由 gate/g8_perf_wiring_test.go 钉住）。
  #   在此之前 `gate.CheckPerf` 全仓没有任何非测试调用点 —— 四条阈值一条都没在把关，
  #   而 docs/05 标着「✅ 已实现」、尾注却写「实测由 CI 的 gate-perf 阶段产出」，
  #   可 CI 里根本没有这个作业。现补上：spark-perf 调 perf.Judge → gate.CheckPerf。
  #
  # 口径（诚实说明）：
  #   * `--measure-bundle` 真实测出「首屏产物 gzip」—— 确定性、无需浏览器，
  #     本作业据此**真正把关**这一条阈值（超标即 CI 红）。
  #   * TTI / 筛选 P95 需要无头浏览器 / 真库，当前作业无法产出 ⇒ 如实标记为「未测」，
  #     故用**非严格**模式（未测不判失败，但会打进日志）。
  #     一旦接上测量源，改成 `--strict` 即可让「未测」也判失败。
  perf:
    name: G8 性能闸门（首屏产物真实测量）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 构建前端产物
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node scripts/build.mjs

      - name: ★ G8 判定（真实测量首屏产物 gzip → gate.CheckPerf）
        working-directory: backend
        run: go run ./cmd/spark-perf --measure-bundle ../web/dist

  # ───────────────────────── 密钥扫描（G11a）─────────────────────────
  secret-scan:
    name: 全仓密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── 上线前证据链（真起进程）─────────────────────────
  launch-check:
    name: 上线前证据链
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_ci_only
          POSTGRES_DB: spark_cicada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spark -d spark_cicada"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # ★ 两个名字都设（同 go 作业，理由见上）。
      SPARK_DB_DSN: postgres://spark:spark_ci_only@localhost:5432/spark_cicada?sslmode=disable
      SPARK_TEST_DB_DSN: postgres://spark:spark_ci_only@localhost:5432/spark_cicada?sslmode=disable
      SPARK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compute

      - name: 安装前端依赖
        working-directory: web
        run: npm install --no-audit --no-fund

      # 预先把迁移应用到真库：让 launch-check 的 §4b 能验证
      # 「真库数据面端到端」（healthz db=true + /api/query 真读库）。
      # 不跑这一步的话，§4b 只能验证「无库降级」，覆盖不到接线正确性。
      - name: 应用迁移（真库）
        working-directory: backend
        run: go run ./cmd/spark-migrate -dir ../sql/migrations -up

      # 显式构建 Rust 计算内核（release）。
      # 不依赖 launch-check 里的「自动构建」兜底：sparkd 是 fail-closed 的，
      # 内核缺货会让 §4b/§8 直接失败；在这里单独一步构建，失败原因更清晰，
      # 也避免多段逻辑共享一个隐式缓存状态。
      - name: 构建计算内核（release）
        working-directory: compute
        run: cargo build --release --locked

      # 脚本里的托管绝对路径在 Linux 上不存在，会回退到 PATH —— 此处显式清空以免误用。
      - name: 上线前证据链
        run: |
          unset GOEXE NODEEXE CARGOEXE GOROOT GOPATH GOCACHE GOTMPDIR
          bash tools/verify/launch-check.sh

  # ───────────────────────── 汇总（分支保护只需勾这一个）─────────────────────────
  gate:
    name: 全部闸门通过
    runs-on: ubuntu-latest
    needs: [go, rust, web, perf, secret-scan, launch-check]
    steps:
      - run: echo "ALL GATES PASSED"
